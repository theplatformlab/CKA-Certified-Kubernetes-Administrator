name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: App and item pool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/cka/go.mod

      # The pool test loads every questions/<id>/ item and checks its
      # metadata, README parts, areas and namespaces.
      - name: go vet and go test
        working-directory: tools/cka
        run: |
          go vet ./...
          go test ./...

      - name: Shell syntax of the scripts, exam shims and item labs
        run: |
          for f in cka scripts/*.sh scripts/lib/*.sh scripts/exam/*.sh \
                   scripts/exam/bashrc scripts/exam/bin/* questions/*/lab.sh; do
            bash -n "$f" || exit 1
          done
