{{- if .Values.crds.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snapshotpolicies.backup.cka-lab.io
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.crds.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  group: backup.cka-lab.io
  scope: Namespaced
  names:
    plural: snapshotpolicies
    singular: snapshotpolicy
    kind: SnapshotPolicy
    shortNames: [snp]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Schedule
      type: string
      jsonPath: .spec.schedule
    - name: Retain
      type: integer
      jsonPath: .spec.retainCount
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: Which volumes to snapshot and how long to keep the snapshots.
            required: [schedule, volumeSelector]
            properties:
              schedule:
                type: string
                description: Cron schedule of the snapshots.
              volumeSelector:
                type: object
                description: Label selector for the PersistentVolumeClaims to snapshot.
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
              retainCount:
                type: integer
                minimum: 1
                description: Number of snapshots to keep per volume; older ones are deleted.
              suspend:
                type: boolean
                description: Pause taking new snapshots.
{{- end }}
