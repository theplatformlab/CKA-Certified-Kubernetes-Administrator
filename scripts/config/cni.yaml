# CNI cluster: created WITHOUT a CNI plugin so one can be installed by hand
# (cni-calico-install). Nodes stay NotReady until a CNI is running.
# podSubnet matches the Calico default.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
- role: control-plane
- role: worker
